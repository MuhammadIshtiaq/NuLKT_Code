[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nulkt"
version = "0.1.0"
description = "NuLKT: uncertainty-aware linguistic knowledge tracing for personalized English learning"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT (code only; dataset retains its original terms)"}
# Upper bounds reflect the environment the test suite is verified against
# (Python 3.12.13, pandas 3.0.5, numpy 2.4.4, torch 2.13.0+cu130). The previous
# "pandas<3" bound excluded the version this project actually runs on, so a fresh
# install produced a different environment from the verified one.
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "pyarrow>=15,<24",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
  "torch>=2.2,<3",
  "PyYAML>=6,<7",
  "requests>=2.31,<3",
  "tqdm>=4.66,<5",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "openpyxl>=3.1,<4",
  "tensorboard>=2.16,<3",
  "psutil>=5.9,<8",
  "joblib>=1.3,<2",
]

[project.optional-dependencies]
research = [
  "optuna>=3.6,<5",
  "xgboost>=2,<4",
  "lightgbm>=4,<5",
  "catboost>=1.2,<2",
  "shap>=0.45,<1",
  "captum>=0.7,<1",
  "statsmodels>=0.14,<1",
  "thop>=0.1.1.post2209072238",
]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.5,<1", "mypy>=1.10,<2"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "A",
  "New Results",
  "colab_bundle",
  "data/raw",
  "notebooks",
  "results/reproduction_bundle",
  ".venv-cpu-unused",
]

[tool.ruff.lint.per-file-ignores]
# These modules intentionally import torch-backed code only after importorskip.
"tests/*.py" = ["E402"]
